<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第7周 Todo V2.0</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Todo V2.0</h1>
    <form id="todo-form">
      <label for="todo-input">任务内容</label>
      <div class="input-row">
        <input id="todo-input" type="text" autocomplete="off" placeholder="输入新的任务">
        <button id="add-btn" type="submit">添加</button>
      </div>
    </form>
    <p id="summary" aria-live="polite"></p>
    <ul id="todo-list" aria-label="任务列表"></ul>
  </main>
</body>
</html>
